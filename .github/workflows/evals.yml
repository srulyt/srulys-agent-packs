name: Evals

on:
  pull_request:
    paths:
      - 'agent-packs/**'
      - '.github/skills/**'
      - '.github/instructions/**'
      - 'evals/**'
      - 'scripts/lint-pack.mjs'
      - 'scripts/run-evals.mjs'
      - 'package.json'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ENGINE_DIR: agent-packs/eval-pilot/engine-ts
  ENGINE_CLI: agent-packs/eval-pilot/engine-ts/dist/cli.js

jobs:
  # Fast, deterministic: runs on every PR. No copilot binary required.
  static:
    name: Static (engine tests + lint + structural evals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install engine deps
        run: npm --prefix "$ENGINE_DIR" install
      - name: Build engine (evalpilot)
        run: npm --prefix "$ENGINE_DIR" run build
      - name: Engine unit tests (vitest)
        run: npm --prefix "$ENGINE_DIR" test
      - name: Lint all packs
        run: node scripts/lint-pack.mjs --all
      - name: Lint all eval specs
        run: node "$ENGINE_CLI" lint evals
      - name: Run structural evals (offline, no SUT)
        run: node "$ENGINE_CLI" run evals --tags structural
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-report
          path: evals/_runs/**

  # Slow + costs LLM tokens: matrix per pack so failures isolate cleanly.
  # Only runs if `copilot` is installed (the check is a no-op placeholder
  # until a CI-friendly install method exists; until then this job skips).
  packs:
    name: Pack evals (${{ matrix.pack }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        pack:
          - copilot-factory
          - product-brief
          - spec-author
          - story-telling-agent
          # add more packs as their evals land
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build engine (evalpilot)
        run: |
          npm --prefix "$ENGINE_DIR" install
          npm --prefix "$ENGINE_DIR" run build
      - name: Check for copilot CLI
        id: copilot
        run: |
          if command -v copilot >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::copilot CLI not installed in CI image; skipping pack evals."
          fi
      - name: Run pack evals
        if: steps.copilot.outputs.available == 'true'
        run: node scripts/run-evals.mjs ${{ matrix.pack }} -- --parallel 4
      - uses: actions/upload-artifact@v4
        if: always() && steps.copilot.outputs.available == 'true'
        with:
          name: pack-${{ matrix.pack }}-report
          path: evals/_runs/**

  skills:
    name: Skill evals
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build engine (evalpilot)
        run: |
          npm --prefix "$ENGINE_DIR" install
          npm --prefix "$ENGINE_DIR" run build
      - name: Check for copilot CLI
        id: copilot
        run: |
          if command -v copilot >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::copilot CLI not installed in CI image; skipping skill evals."
          fi
      - name: Run skill evals
        if: steps.copilot.outputs.available == 'true'
        run: node "$ENGINE_CLI" run evals/skills --parallel 4
      - uses: actions/upload-artifact@v4
        if: always() && steps.copilot.outputs.available == 'true'
        with:
          name: skills-report
          path: evals/_runs/**
